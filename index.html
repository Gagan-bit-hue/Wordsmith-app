<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wordsmith — learn English</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2D4A7C">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wordsmith">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF8F3; --surface:#FFFFFF; --surface-2:#F1EDE4;
  --ink:#1C2530; --ink-soft:#5B6875; --ink-faint:#8B95A1;
  --rule:#E3DED2; --indigo:#2D4A7C; --indigo-ink:#2D4A7C; --indigo-soft:#E8EDF6;
  --marigold:#E09A2E; --green:#3C7A5A; --green-soft:#E4F0E9;
  --berry:#A93B4B; --berry-soft:#F8E6E8;
  --shadow:0 1px 0 rgba(28,37,48,.06);
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12181E; --surface:#1A222B; --surface-2:#222C36;
    --ink:#E9E6E0; --ink-soft:#A3AEB9; --ink-faint:#7C8793;
    --rule:#2B353F; --indigo:#9CBAE8; --indigo-ink:#9CBAE8; --indigo-soft:#1E2B3C;
    --marigold:#E8B25C; --green:#74B693; --green-soft:#1B2E25;
    --berry:#E48A95; --berry-soft:#332024; --shadow:0 1px 0 rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#12181E; --surface:#1A222B; --surface-2:#222C36;
  --ink:#E9E6E0; --ink-soft:#A3AEB9; --ink-faint:#7C8793;
  --rule:#2B353F; --indigo:#9CBAE8; --indigo-ink:#9CBAE8; --indigo-soft:#1E2B3C;
  --marigold:#E8B25C; --green:#74B693; --green-soft:#1B2E25;
  --berry:#E48A95; --berry-soft:#332024; --shadow:0 1px 0 rgba(0,0,0,.3);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:88px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--marigold);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--rule);background:var(--paper);position:sticky;top:0;z-index:20}
.top-in{max-width:720px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:-.01em;margin-right:auto}
.brand span{color:var(--marigold)}
.iconbtn{background:none;border:1px solid var(--rule);border-radius:999px;
  width:34px;height:34px;display:grid;place-items:center;font-size:14px;color:var(--ink-soft)}
.lvlpick{border:1px solid var(--rule);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;font-family:inherit}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--rule);padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.tabs-in{max-width:720px;margin:0 auto;display:flex}
.tab{flex:1;background:none;border:0;padding:7px 1px 5px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink-faint)}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--indigo-ink)}

main{padding-top:22px}
.view{display:none}
.view.on{display:block}

h2.vh{font-family:var(--serif);font-weight:600;font-size:27px;letter-spacing:-.015em;margin:0 0 4px}
p.vsub{margin:0 0 20px;color:var(--ink-soft);font-size:14.5px;max-width:52ch}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.btn{background:var(--indigo);color:var(--paper);border:0;border-radius:9px;padding:11px 18px;font-weight:600;font-size:14.5px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--rule)}
.btn.wide{display:block;width:100%;text-align:center}
.btn:disabled{opacity:.45;cursor:default}
.eng{font-family:var(--serif)}
.hidden{display:none!important}
.meter{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--marigold);border-radius:99px;transition:width .35s ease}

.hero{border:1px solid var(--rule);border-radius:14px;background:var(--surface);padding:22px;margin-bottom:22px}
.hero .kicker{font-size:12px;font-weight:600;color:var(--ink-faint);margin-bottom:10px}
.hero .word{font-family:var(--serif);font-size:38px;font-weight:600;letter-spacing:-.02em;line-height:1.05;margin:0}
.ipa{font-family:var(--serif);color:var(--ink-faint);font-size:15px;margin-top:6px}
.pos{font-style:italic;color:var(--indigo-ink);font-size:14px}
.sense{margin:12px 0 0;font-size:15.5px}
.usage{font-family:var(--serif);font-size:16px;color:var(--ink-soft);
  border-left:2px solid var(--marigold);padding-left:12px;margin-top:12px}
.stats{display:flex;gap:10px;margin-bottom:22px}
.stat{flex:1;background:var(--surface);border:1px solid var(--rule);border-radius:11px;padding:13px 14px}
.stat b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.1}
.stat span{font-size:12px;color:var(--ink-faint);font-weight:500}
.skillrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--rule);border-radius:11px;padding:14px 16px;margin-bottom:10px}
.skillrow .nm{font-weight:600;font-size:15px;display:block}
.skillrow .ds{font-size:12.5px;color:var(--ink-faint);display:block}
.skillrow .grow{flex:1;min-width:0}
.skillrow .pct{font-size:12.5px;color:var(--ink-soft);font-weight:600;flex-shrink:0}
.skillrow .meter{margin-top:7px}

.deckhead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.deckhead .cnt{font-size:13px;color:var(--ink-faint);margin-left:auto}
.flash{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:30px 22px;
  min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;position:relative}
.flash .word{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:-.02em}
.flash .tapnote{position:absolute;bottom:12px;left:0;right:0;font-size:11.5px;color:var(--ink-faint)}
.flash .back{text-align:left}
.cardacts{display:flex;gap:10px;margin-top:14px}
.cardacts .btn{flex:1}
.knowbtn{background:var(--green-soft);color:var(--green);border:1px solid transparent;font-weight:600}
.againbtn{background:var(--surface-2);color:var(--ink-soft);border:1px solid transparent;font-weight:600}

.listitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--rule);border-radius:11px;padding:14px 16px;margin-bottom:10px}
.listitem .grow{flex:1;min-width:0}
.listitem .nm{font-weight:600;font-size:15px;margin-bottom:2px;display:block}
.listitem .ds{font-size:13px;color:var(--ink-faint);display:block}
.num{font-family:var(--serif);font-size:15px;color:var(--indigo-ink);font-weight:600;width:26px;flex-shrink:0}
.doneflag{color:var(--green);font-size:15px;flex-shrink:0}

.backlink{background:none;border:0;padding:0;color:var(--indigo-ink);font-size:13.5px;font-weight:600;margin-bottom:14px}
.lesson h3{font-family:var(--serif);font-size:25px;font-weight:600;margin:0 0 12px;letter-spacing:-.015em}
.lesson p{font-size:15.5px;margin:0 0 13px;max-width:62ch}
.exbox{background:var(--surface);border:1px solid var(--rule);border-radius:11px;padding:6px 16px;margin:16px 0}
.exbox .ex{font-family:var(--serif);font-size:16.5px;padding:11px 0;border-bottom:1px solid var(--rule)}
.exbox .ex:last-child{border-bottom:0}
.exbox .ex em{color:var(--ink-faint);font-family:var(--sans);font-size:13px;font-style:normal;display:block;margin-top:3px}
.passage{font-family:var(--serif);font-size:17.5px;line-height:1.72;max-width:60ch}
.passage p{margin:0 0 15px}

.q{margin-top:22px;padding-top:20px;border-top:1px solid var(--rule)}
.q .stem{font-family:var(--serif);font-size:18px;margin-bottom:14px;line-height:1.45}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--rule);
  border-radius:9px;padding:12px 14px;margin-bottom:8px;font-size:15px;font-family:var(--serif)}
.opt.right{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:600}
.opt.wrong{background:var(--berry-soft);border-color:var(--berry);color:var(--berry)}
.opt:disabled{cursor:default}
.why{font-size:14px;color:var(--ink-soft);margin-top:10px;padding:11px 13px;background:var(--surface-2);border-radius:9px}
.qcount{font-size:12.5px;color:var(--ink-faint);font-weight:600;margin-bottom:10px}
.scorebox{text-align:center;padding:26px 18px}
.scorebox b{font-family:var(--serif);font-size:40px;font-weight:600;display:block}

.line{display:flex;gap:11px;margin-bottom:13px;align-items:flex-start}
.who{font-size:11.5px;font-weight:700;color:var(--ink-faint);width:56px;flex-shrink:0;padding-top:4px}
.said{font-family:var(--serif);font-size:16.5px;background:var(--surface);border:1px solid var(--rule);
  border-radius:11px;padding:10px 14px}
.line.you .said{background:var(--indigo-soft);border-color:transparent}
.phrase{border-bottom:1px solid var(--rule);padding:12px 0}
.phrase:last-child{border-bottom:0}
.phrase .p{font-family:var(--serif);font-size:16.5px}
.phrase .n{font-size:13.5px;color:var(--ink-soft);margin-top:3px}

.ai{border:1px solid var(--rule);border-radius:12px;background:var(--surface);padding:16px;margin-top:22px}
.ai h4{margin:0 0 4px;font-size:15px;font-weight:600}
.ai .hint{font-size:13px;color:var(--ink-faint);margin:0 0 12px}
.ai textarea,.ai input[type=text]{width:100%;font-family:var(--serif);font-size:16px;color:var(--ink);
  background:var(--paper);border:1px solid var(--rule);border-radius:9px;padding:11px 13px;resize:vertical}
.ai textarea{min-height:76px}
.chatlog{max-height:340px;overflow-y:auto;margin-bottom:12px}
.chatrow{display:flex;margin-bottom:10px}
.bub{font-family:var(--serif);font-size:16px;border-radius:12px;padding:9px 13px;max-width:84%;background:var(--surface-2);white-space:pre-wrap}
.chatrow.me{justify-content:flex-end}
.chatrow.me .bub{background:var(--indigo-soft)}
.fbk{margin-top:12px;font-size:14.5px}
.fbk .verdict{font-weight:700;margin-bottom:6px}
.fbk .verdict.ok{color:var(--green)}
.fbk .verdict.fix{color:var(--berry)}
.fbk .fixed{font-family:var(--serif);font-size:16.5px;margin:8px 0;padding-left:12px;border-left:2px solid var(--marigold)}
.spin{font-size:13.5px;color:var(--ink-faint)}
.empty{color:var(--ink-faint);font-size:14.5px;text-align:center;padding:30px 10px}

/* toolkit */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.chip{white-space:nowrap;background:var(--surface);border:1px solid var(--rule);border-radius:999px;
  padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:var(--paper)}
.searchbox{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:var(--surface);
  border:1px solid var(--rule);border-radius:9px;padding:10px 13px;margin-bottom:14px}
.entry{border-bottom:1px solid var(--rule);padding:13px 0}
.entry:last-child{border-bottom:0}
.entry .hw{font-family:var(--serif);font-size:17px;font-weight:600}
.entry .mn{font-size:14px;color:var(--ink-soft);margin-top:2px}
.entry .eg{font-family:var(--serif);font-size:15.5px;color:var(--ink-faint);margin-top:5px}
.vtable{width:100%;border-collapse:collapse;font-family:var(--serif);font-size:15.5px}
.vtable th{font-family:var(--sans);font-size:11.5px;font-weight:700;color:var(--ink-faint);
  text-align:left;padding:8px 8px;border-bottom:1px solid var(--rule)}
.vtable td{padding:9px 8px;border-bottom:1px solid var(--rule)}
.vtable tr:last-child td{border-bottom:0}
.scrollx{overflow-x:auto}
.tally{font-size:12.5px;color:var(--ink-faint);margin-bottom:10px}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">Word<span>smith</span></div>
    <select class="lvlpick" id="lvlpick" aria-label="Your level">
      <option value="beginner">Beginner</option>
      <option value="intermediate">Intermediate</option>
      <option value="advanced">Advanced</option>
    </select>
    <button class="iconbtn" id="themebtn" aria-label="Switch light or dark">◐</button>
  </div>
</header>

<main>
  <section class="view on" id="v-home"><div class="wrap" id="home"></div></section>
  <section class="view" id="v-words"><div class="wrap" id="words"></div></section>
  <section class="view" id="v-grammar"><div class="wrap" id="grammar"></div></section>
  <section class="view" id="v-talk"><div class="wrap" id="talk"></div></section>
  <section class="view" id="v-read"><div class="wrap" id="read"></div></section>
  <section class="view" id="v-tools"><div class="wrap" id="tools"></div></section>
</main>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in">
    <button class="tab" data-go="home" aria-current="page">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Home</button>
    <button class="tab" data-go="words">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h6M7 13h10"/></svg>Words</button>
    <button class="tab" data-go="grammar">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h11M4 18h7"/><path d="M17 17l2 2 3-4"/></svg>Grammar</button>
    <button class="tab" data-go="talk">
      <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>Talk</button>
    <button class="tab" data-go="read">
      <svg viewBox="0 0 24 24"><path d="M3 5h7a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H3Z"/><path d="M21 5h-7a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h7Z"/></svg>Read</button>
    <button class="tab" data-go="tools">
      <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 1 5 5L10 21l-5 1 1-5Z"/><path d="M13 8l3 3"/></svg>Tools</button>
  </div>
</nav>

<script>
const VOCAB = {
beginner:[
 {id:"b1",w:"borrow",ipa:"/ˈbɒr.oʊ/",pos:"verb",def:"To take something from someone and give it back later.",ex:"Can I borrow your pen for a minute?",note:"You borrow from someone; they lend to you."},
 {id:"b2",w:"afford",ipa:"/əˈfɔːrd/",pos:"verb",def:"To have enough money or time for something.",ex:"We can't afford a new car this year.",note:"Almost always used with can, can't or could."},
 {id:"b3",w:"crowded",ipa:"/ˈkraʊ.dɪd/",pos:"adjective",def:"Full of people, with little space left.",ex:"The bus was crowded this morning.",note:"Describes a place, never a person."},
 {id:"b4",w:"queue",ipa:"/kjuː/",pos:"noun, verb",def:"A line of people waiting for their turn.",ex:"There was a long queue outside the bank.",note:"British English; Americans usually say line."},
 {id:"b5",w:"tidy",ipa:"/ˈtaɪ.di/",pos:"adjective, verb",def:"Neat, with everything in its proper place.",ex:"Her desk is always tidy.",note:"Tidy up means to put things back in order."},
 {id:"b6",w:"spare",ipa:"/sper/",pos:"adjective",def:"Extra, kept in case it is needed.",ex:"Do you have a spare charger?",note:"Spare time means free time."},
 {id:"b7",w:"chore",ipa:"/tʃɔːr/",pos:"noun",def:"A small job around the house that has to be done regularly.",ex:"Washing the dishes is my least favourite chore.",note:"Often plural: household chores."},
 {id:"b8",w:"hurry",ipa:"/ˈhɜːr.i/",pos:"verb, noun",def:"To move or act more quickly than usual.",ex:"Hurry — the train leaves in five minutes.",note:"Be in a hurry = have very little time."},
 {id:"b9",w:"polite",ipa:"/pəˈlaɪt/",pos:"adjective",def:"Behaving in a way that shows respect for others.",ex:"It's polite to say thank you.",note:"The everyday opposite is rude."},
 {id:"b10",w:"fetch",ipa:"/fetʃ/",pos:"verb",def:"To go somewhere, collect something, and bring it back.",ex:"Could you fetch me a glass of water?",note:"Fetch includes the journey there and back; bring does not."},
 {id:"b11",w:"nearby",ipa:"/ˌnɪrˈbaɪ/",pos:"adjective, adverb",def:"A short distance away from here.",ex:"Is there a pharmacy nearby?",note:"No preposition after it — not nearby to here."},
 {id:"b12",w:"upset",ipa:"/ʌpˈset/",pos:"adjective, verb",def:"Unhappy or worried because something bad happened.",ex:"She was upset about losing her keys.",note:"Stronger than sad, softer than angry."},
 {id:"b13",w:"enough",ipa:"/ɪˈnʌf/",pos:"determiner, adverb",def:"As much as is needed.",ex:"We have enough chairs for everyone.",note:"Before nouns: enough time. After adjectives: warm enough."},
 {id:"b14",w:"almost",ipa:"/ˈɔːl.moʊst/",pos:"adverb",def:"Very nearly, but not completely.",ex:"I'm almost ready.",note:"Goes before the word it changes: almost finished."},
 {id:"b15",w:"break",ipa:"/breɪk/",pos:"noun, verb",def:"A short rest from work; also, to separate into pieces.",ex:"Let's take a ten-minute break.",note:"Past forms: broke, broken."},
 {id:"b16",w:"cheap",ipa:"/tʃiːp/",pos:"adjective",def:"Costing little money.",ex:"The market is cheaper than the supermarket.",note:"Cheap can suggest poor quality; inexpensive is safer for praise."},
 {id:"b17",w:"busy",ipa:"/ˈbɪz.i/",pos:"adjective",def:"Having a lot to do; also, full of activity.",ex:"I'm busy on Friday, sorry.",note:"Busy with something, or busy doing something."},
 {id:"b18",w:"lend",ipa:"/lend/",pos:"verb",def:"To give something to someone for a short time.",ex:"Could you lend me twenty rupees?",note:"The mirror of borrow. Past form: lent."},
 {id:"b19",w:"careful",ipa:"/ˈker.fəl/",pos:"adjective",def:"Giving attention so nothing goes wrong.",ex:"Be careful — the floor is wet.",note:"Careful with something; careful to do something."},
 {id:"b20",w:"early",ipa:"/ˈɜːr.li/",pos:"adjective, adverb",def:"Before the usual or arranged time.",ex:"I woke up early today.",note:"No preposition: arrive early, not arrive in early."},
 {id:"b21",w:"weather",ipa:"/ˈweð.ər/",pos:"noun",def:"The state of the sky and air — rain, sun, wind, heat.",ex:"The weather was terrible all week.",note:"Uncountable: never a weather or weathers."},
 {id:"b22",w:"receipt",ipa:"/rɪˈsiːt/",pos:"noun",def:"A small printed paper proving you paid.",ex:"Keep the receipt in case you return it.",note:"The p is silent."},
 {id:"b23",w:"advice",ipa:"/ədˈvaɪs/",pos:"noun",def:"An opinion about what someone should do.",ex:"She gave me some good advice.",note:"Uncountable: a piece of advice, never advices."},
 {id:"b24",w:"borrowed time",ipa:"/ˈbɒr.oʊd ˈtaɪm/",pos:"phrase",def:"Extra time that will not last.",ex:"That old fridge is living on borrowed time.",note:"A first taste of idiom — always with living on."},
 {id:"b25",w:"choose",ipa:"/tʃuːz/",pos:"verb",def:"To decide which one you want.",ex:"You can choose any seat you like.",note:"Past: chose. Participle: chosen."},
 {id:"b26",w:"empty",ipa:"/ˈemp.ti/",pos:"adjective, verb",def:"Containing nothing.",ex:"The bottle is empty.",note:"The opposite is full, not filled."},
 {id:"b27",w:"foreign",ipa:"/ˈfɔːr.ən/",pos:"adjective",def:"Belonging to a country that is not yours.",ex:"She speaks three foreign languages.",note:"The g is silent."},
 {id:"b28",w:"guess",ipa:"/ɡes/",pos:"verb, noun",def:"To give an answer without being sure.",ex:"Guess how old he is.",note:"I guess so is a mild yes in speech."},
 {id:"b29",w:"loud",ipa:"/laʊd/",pos:"adjective",def:"Making a lot of noise.",ex:"The music was too loud.",note:"Aloud means out loud when reading — a different word."},
 {id:"b30",w:"nervous",ipa:"/ˈnɜːr.vəs/",pos:"adjective",def:"Worried about something that is about to happen.",ex:"I'm nervous about the interview.",note:"Nervous about, not nervous for."}
],
intermediate:[

 {id:"g1",t:"a, an and the",
  body:["Use <b>a</b> or <b>an</b> the first time you mention something, when it is one of many. Use <b>an</b> before a vowel <i>sound</i>: an hour, an email — but a university, because that begins with a /j/ sound.",

 {id:"g3",t:"The past simple",
  body:["Regular verbs add <b>-ed</b>: walk → walked. If the verb ends in a consonant plus <i>y</i>, it becomes <i>-ied</i>: study → studied.",

 {id:"g4",t:"there is, there are, have got",
  body:["<b>There is</b> and <b>there are</b> announce that something exists. Singular and uncountable take <i>is</i>; plurals take <i>are</i>: <i>There is milk. There are two shops.</i>",

 {id:"g5",t:"Countable and uncountable nouns",
  body:["<b>Countable</b> nouns can be counted and made plural: one chair, two chairs. <b>Uncountable</b> nouns cannot: water, rice, money, information, advice, furniture, news, luggage.",
        "Use <b>many</b> and <b>a few</b> with countables; <b>much</b> and <b>a little</b> with uncountables. <b>A lot of</b> works with both and is safest in speech.",

 {id:"g6",t:"Prepositions of time and place",
  body:["Time: <b>at</b> for clock times and festivals (at 6pm, at night), <b>on</b> for days and dates (on Monday, on 3 May), <b>in</b> for longer periods (in June, in 2026, in the morning).",
        "Place: <b>at</b> for a point (at the door, at the station), <b>on</b> for a surface or line (on the table, on the wall, on the bus), <b>in</b> for an enclosed space (in the box, in the car, in Mumbai).",
        "Some pairs are simply fixed and worth memorising: <i>in the morning</i> but <i>at night</i>; <i>on the bus</i> but <i>in the car</i>; <i>at home</i>, <i>at work</i>, <i>in bed</i>."],

 {id:"g7",t:"Adjectives and their order",
  body:["Adjectives come before the noun and never take a plural -s: <i>two red cars</i>, never <i>two reds cars</i>.",
        "When several adjectives stack up, English follows a fixed order: opinion, size, age, shape, colour, origin, material, purpose. <i>A lovely little old round brown Italian wooden dining table.</i> You will rarely use more than three.",

 {id:"g8",t:"Talking about the future",
  body:["<b>will</b> is for decisions made as you speak, predictions and promises: <i>I'll get it. It'll rain later.</i>",
        "<b>going to</b> is for plans already made and for predictions with visible evidence: <i>We're going to paint the kitchen. Look — it's going to fall.</i>",
        "The <b>present continuous</b> covers fixed arrangements with a time and place: <i>I'm meeting Sara at six.</i> The <b>present simple</b> covers timetables: <i>The flight leaves at nine.</i>"],

      ["I'm seeing the dentist on Thursday.","Fixed arrangement."],
      ["The shop opens at ten.","Timetable."]],

      ["We've lived here since 2020.","Starting point."],
      ["She's worked here for six months.","Length."]],
  qs:[{s:"I ___ my keys — I can't get in.",o:["lost","have lost","was losing","had lost"],c:1,w:"The past action has a present consequence."},
      {s:"Shakespeare ___ 37 plays.",o:["has written","wrote","has wrote","writes"],c:1,w:"His life is finished, so past simple."},
      {s:"We've been waiting ___ half an hour.",o:["since","for","from","during"],c:1,w:"A length of time takes for."},
      {s:"___ you ever ___ sushi?",o:["Did / eat","Have / eaten","Have / ate","Did / eaten"],c:1,w:"Ever asks about experience at any time."},
      {s:"She hasn't finished ___.",o:["already","still","yet","just"],c:2,w:"Yet sits at the end of negatives and questions."}]},
 {id:"g10",t:"Conditionals: zero, first and second",
  body:["<b>Zero</b> (if + present, present) states something always true: <i>If you heat water to 100°C, it boils.</i>",
        "<b>First</b> (if + present, will + verb) talks about a real future possibility. Never put <i>will</i> in the if-clause.",
        "<b>Second</b> (if + past, would + verb) talks about something imaginary or unlikely now. With <i>be</i>, formal English uses <i>were</i> for every subject."],
  ex:[["If you press this, the light comes on.","Always true."],
      ["If you finish early, I'll call you.","Real possibility."],
      ["If I won the lottery, I'd move abroad.","Imaginary."],
      ["If I were you, I'd apologise.","Fixed advice phrase."]],
  qs:[{s:"If you ___ me, I'll help you.",o:["will ask","ask","asked","would ask"],c:1,w:"The if-clause takes the present simple."},
      {s:"If I ___ taller, I would play basketball.",o:["am","was being","were","will be"],c:2,w:"Second conditional; were is standard after if."},
      {s:"Water ___ if you put it in the freezer.",o:["would freeze","freezes","will froze","froze"],c:1,w:"A general fact takes the zero conditional."},
      {s:"If she had a car, she ___ to work.",o:["will drive","drives","would drive","drove"],c:2,w:"Past tense pairs with would."},
      {s:"Unless it ___, we'll walk.",o:["will rain","rains","rained","would rain"],c:1,w:"Unless behaves like if not and takes the present."}]},
 {id:"g11",t:"Reported speech",
  body:["When you report what someone said earlier, the tense usually steps back one: present → past, past → past perfect, will → would, can → could.",
        "Words pointing at the here and now shift too: today → that day, tomorrow → the next day, this → that, here → there.",
        "Reported questions keep statement word order and drop do/does/did. Yes/no questions take <b>if</b> or <b>whether</b>."],
  ex:[["'I'm tired.' → She said she was tired.","Present steps back."],
      ["'I'll call you.' → He said he would call me.","Will becomes would."],
      ["'Where do you work?' → She asked where I worked.","No did."],
      ["'Did you eat?' → He asked if I had eaten.","Yes/no takes if."]],
  qs:[{s:"'I can swim.' → He said he ___ swim.",o:["can","could","would","can't"],c:1,w:"Can steps back to could."},
      {s:"'We're leaving tomorrow.' → They said they were leaving ___.",o:["tomorrow","the next day","yesterday","that night"],c:1,w:"Tomorrow shifts once the moment has passed."},
      {s:"She asked me where ___.",o:["did I live","I lived","do I live","I did live"],c:1,w:"Reported questions use statement order."},
      {s:"'Are you coming?' → He asked ___ I was coming.",o:["that","what","if","which"],c:2,w:"Yes/no questions take if or whether."},
      {s:"'Don't touch it.' → She told me ___ touch it.",o:["don't","not to","to not","didn't"],c:1,w:"Negative commands are reported with told someone not to."}]},
 {id:"g12",t:"Modals of obligation and permission",
  body:["<b>Must</b> expresses obligation the speaker feels themselves; <b>have to</b> expresses obligation coming from outside — a rule, a boss, a law.",
        "<b>Mustn't</b> means it is forbidden. <b>Don't have to</b> means it is not necessary. These are completely different, and confusing them changes the meaning entirely.",
        "<b>Can, could, may</b> ask permission, rising in formality. <b>Should</b> and <b>ought to</b> give advice; <b>had better</b> warns of a bad consequence."],
  ex:[["I must remember to call her.","Personal obligation."],
      ["I have to wear a uniform at work.","External rule."],
      ["You mustn't park here.","Forbidden."],
      ["You don't have to come.","Optional."]],
  qs:[{s:"Passengers ___ smoke on board.",o:["don't have to","mustn't","needn't","shouldn't have"],c:1,w:"Smoking is forbidden, so mustn't."},
      {s:"It's Sunday, so we ___ get up early.",o:["mustn't","don't have to","can't","shouldn't"],c:1,w:"It is simply not necessary."},
      {s:"___ I borrow your laptop for an hour?",o:["Must","Should","Could","Would"],c:2,w:"Could is the normal polite request."},
      {s:"You ___ leave now or you'll miss it.",o:["had better","would better","should better","have better"],c:0,w:"Had better warns of a consequence."},
      {s:"In my last job I ___ work weekends.",o:["must","had to","have to","mustn't"],c:1,w:"Must has no past form; use had to."}]},
 {id:"g13",t:"used to, would, be used to",
  body:["<b>Used to + verb</b> describes a past habit or state that is no longer true: <i>I used to smoke.</i> In questions and negatives it loses the d: <i>Did you use to…?</i>",
        "<b>Would + verb</b> also describes repeated past actions in storytelling, but it cannot describe past states. <i>We would walk to school</i> is fine; <i>I would live in Delhi</i> is not.",
        "<b>Be used to + noun or -ing</b> is a different structure entirely. It means something is now familiar: <i>I'm used to the noise. She's getting used to working nights.</i>"],
  ex:[["I used to play cricket every Sunday.","Past habit, now stopped."],
      ["There used to be a cinema here.","Past state."],
      ["Every summer we would visit my grandmother.","Repeated past action."],
      ["He isn't used to driving on the left.","Familiarity, not a past habit."]],
  qs:[{s:"Did you ___ live in Chennai?",o:["used to","use to","using to","are used to"],c:1,w:"After did, the d disappears."},
      {s:"I can't sleep — I'm not used to ___ so early.",o:["get up","got up","getting up","get"],c:2,w:"Be used to takes a noun or -ing form."},
      {s:"There ___ be a bakery on this corner.",o:["used to","use to","would","is used to"],c:0,w:"A past state needs used to, not would."},
      {s:"When we were children we ___ swim in the river every day.",o:["are used to","used","would","use to"],c:2,w:"Would works for repeated past actions in a story."},
      {s:"After a month she ___ the new system.",o:["used to","got used to","would","use to"],c:1,w:"Get used to describes becoming familiar."}]},
 {id:"g14",t:"Relative clauses",
  body:["<b>Defining</b> clauses identify which one you mean and take no commas: <i>The man who fixed my car is retiring.</i> Use who for people, which for things, that for either.",
        "<b>Non-defining</b> clauses add extra information about something already identified, and they need commas. <i>That</i> is never allowed here: <i>My brother, who lives in Leeds, is a nurse.</i>",
        "In defining clauses you may drop the pronoun when it is the object: <i>The film (that) we watched was long.</i> You cannot drop it when it is the subject."],
  ex:[["The book that I lent you is overdue.","Object — that can be dropped."],
      ["The woman who called wants a refund.","Subject — keep who."],
      ["Delhi, which I visited last year, is enormous.","Extra information, commas needed."],
      ["That's the shop where I bought it.","Where replaces in which."]],
  qs:[{s:"The house ___ we bought needs a new roof.",o:["who","whose","that","where"],c:2,w:"That refers to a thing in a defining clause."},
      {s:"My aunt, ___ lives in Kochi, is visiting.",o:["that","who","which","whom"],c:1,w:"Non-defining clauses about people take who, never that."},
      {s:"That's the teacher ___ daughter won the prize.",o:["who","which","whose","that"],c:2,w:"Whose shows possession."},
      {s:"In which sentence can the pronoun be left out?",o:["The man who called was rude.","The email that arrived was spam.","The email that I sent was long.","The dog which barks is his."],c:2,w:"The pronoun is the object there, so it can be dropped."},
      {s:"Do you remember the year ___ we moved?",o:["which","when","where","who"],c:1,w:"When refers to a time."}]},
 {id:"g15",t:"Comparatives and superlatives",
  body:["Short adjectives add <b>-er</b> and <b>-est</b>: cheap, cheaper, the cheapest. Adjectives of two syllables ending in -y change to -ier, -iest: happy, happier.",
        "Longer adjectives take <b>more</b> and <b>the most</b>: expensive, more expensive, the most expensive. A few are irregular: good/better/best, bad/worse/worst, far/further/furthest.",
        "Compare with <b>than</b>. For equality use <b>as … as</b>: <i>as cheap as</i>. To show change over time, double the comparative: <i>hotter and hotter</i>. For linked change, use <i>the … the …</i>: <i>The sooner, the better.</i>"],
  ex:[["This route is quicker than the other one.","Short adjective."],
      ["It's the most interesting book I've read.","Long adjective."],
      ["Her English is as good as mine.","Equality."],
      ["The more you practise, the easier it gets.","Linked change."]],
  qs:[{s:"Today is ___ than yesterday.",o:["hotter","more hot","hottest","the hotter"],c:0,w:"Short adjectives take -er, doubling the final consonant."},
      {s:"This is ___ film of the year.",o:["the worse","worst","the worst","more bad"],c:2,w:"Bad is irregular and superlatives take the."},
      {s:"He isn't ___ his brother.",o:["as tall as","so tall than","taller as","as tall than"],c:0,w:"Equality uses as + adjective + as."},
      {s:"The exam was ___ than I expected.",o:["difficult","more difficult","most difficult","difficulter"],c:1,w:"Long adjectives take more."},
      {s:"___ we leave, ___ we'll arrive.",o:["Sooner / earlier","The sooner / the earlier","More soon / more early","The soonest / the earliest"],c:1,w:"Linked change uses the … the …"}]},
 {id:"g16",t:"Gerunds and infinitives",
  body:["Some verbs are followed by <b>-ing</b>: enjoy, avoid, finish, suggest, mind, practise, consider, miss. <i>I enjoy cooking.</i>",
        "Others are followed by <b>to + verb</b>: want, decide, hope, promise, agree, manage, offer, refuse, learn. <i>She decided to leave.</i>",
        "After prepositions, always use -ing: <i>good at swimming, interested in learning, instead of waiting</i>. A few verbs take both with a change of meaning: <i>I stopped smoking</i> (quit) versus <i>I stopped to smoke</i> (paused in order to)."],
  ex:[["I don't mind waiting.","Mind takes -ing."],
      ["They agreed to meet on Friday.","Agree takes to."],
      ["She's interested in studying law.","After a preposition."],
      ["I remembered to lock the door.","Remembered first, then acted."]],
  qs:[{s:"He avoided ___ the question.",o:["to answer","answering","answer","answered"],c:1,w:"Avoid is always followed by -ing."},
      {s:"We hope ___ you soon.",o:["seeing","to see","see","saw"],c:1,w:"Hope takes the infinitive."},
      {s:"She's good at ___ problems.",o:["solve","to solve","solving","solved"],c:2,w:"After a preposition, use -ing."},
      {s:"I stopped ___ a coffee on the way.",o:["buying","to buy","buy","bought"],c:1,w:"Stopped to buy means paused in order to buy."},
      {s:"They refused ___ the offer.",o:["accepting","accept","to accept","accepted"],c:2,w:"Refuse takes the infinitive."}]}
],
advanced:[
 {id:"g17",t:"Third and mixed conditionals",
  body:["The third conditional (if + past perfect, would have + past participle) describes a past that did not happen: <i>If I had left earlier, I wouldn't have missed the train.</i> Both halves are unreal.",
        "<b>Mixed conditionals</b> join a past condition to a present result: <i>If I had taken that job, I'd be living in Berlin now.</i>",
        "Related regret structures: <b>should have</b> + past participle criticises a past choice, <b>wish</b> + past perfect expresses regret, and <b>if only</b> intensifies it."],
  ex:[["If we had booked earlier, it would have been cheaper.","Neither happened."],
      ["If she had studied medicine, she'd be a doctor today.","Past cause, present result."],
      ["You should have told me.","Criticism of a past choice."],
      ["I wish I hadn't said that.","Regret about a finished action."]],
  qs:[{s:"If they ___ the warning, the accident wouldn't have happened.",o:["heard","had heard","would hear","have heard"],c:1,w:"The if-clause takes the past perfect."},
      {s:"I wish I ___ harder for that exam.",o:["studied","had studied","would study","have studied"],c:1,w:"Regret about a finished action uses wish + past perfect."},
      {s:"If he hadn't moved to Canada, we ___ still neighbours.",o:["would have been","would be","will be","had been"],c:1,w:"A mixed conditional: past cause, present result."},
      {s:"You ___ have locked the door. Now anyone can walk in.",o:["should","would","could","must"],c:0,w:"Should have criticises a past choice."},
      {s:"If only I ___ the email before replying.",o:["read","had read","would read","have read"],c:1,w:"If only about the past takes the past perfect."}]},
 {id:"g18",t:"The passive, and when it earns its place",
  body:["Form the passive with <b>be</b> in the right tense plus the past participle: is built, was built, has been built, will be built, is being built.",
        "The passive is the better choice when the doer is unknown, obvious or irrelevant, or when you want the receiver of the action at the front of the sentence.",
        "Use <b>by</b> only when the doer adds information. Reporting structures — <i>It is thought that…, He is said to be…</i> — are a formal passive worth having."],
  ex:[["My wallet was stolen on the train.","Doer unknown."],
      ["The results will be announced on Friday.","Doer irrelevant."],
      ["The report is being reviewed.","Deliberately impersonal."],
      ["The temple is believed to date from 1200.","Formal reporting passive."]],
  qs:[{s:"The parcel ___ yesterday.",o:["was delivered","delivered","is delivered","has delivering"],c:0,w:"Past passive: was + participle."},
      {s:"The road ___ at the moment.",o:["is repaired","repairs","is being repaired","was repairing"],c:2,w:"Present continuous passive."},
      {s:"Which uses the passive well?",o:["The window was broken by somebody.","Somebody broke the window.","The window was broken during the night.","By somebody the window was broken."],c:2,w:"Unknown doer and no pointless by-phrase."},
      {s:"Nothing ___ about the complaint so far.",o:["has done","has been done","was being done","is doing"],c:1,w:"Present perfect passive."},
      {s:"It ___ that the talks will resume.",o:["is expected","expects","has expecting","is expecting"],c:0,w:"A formal reporting passive."}]},
 {id:"g19",t:"Inversion for emphasis",
  body:["In formal or literary English, certain negative and limiting expressions at the front of a sentence force subject and auxiliary to swap places, as in a question.",
        "This happens after <b>never, rarely, seldom, hardly, no sooner, not only, little, at no time</b> and <b>under no circumstances</b>.",
        "It also appears in formal conditionals where <i>if</i> disappears: <i>Had I known, I would have called. Should you need help, ask. Were he to refuse, we'd reconsider.</i>"],
  ex:[["Rarely does he arrive on time.","Rarely + does + subject."],
      ["Not only did she win, but she broke the record.","Not only inverts the first clause."],
      ["No sooner had we sat down than the phone rang.","No sooner pairs with than."],
      ["Should you change your mind, let me know.","Formal first conditional."]],
  qs:[{s:"Never ___ such a beautiful sunset.",o:["I have seen","have I seen","I saw","did I saw"],c:1,w:"Never at the front inverts auxiliary and subject."},
      {s:"Hardly ___ the door when the bell rang again.",o:["I had closed","had I closed","did I closed","I closed"],c:1,w:"Hardly triggers inversion."},
      {s:"___ I known about the delay, I'd have waited.",o:["If","Had","Have","Should"],c:1,w:"Had replaces if had in formal style."},
      {s:"Under no circumstances ___ this door be left open.",o:["should","should it","must not","it should"],c:0,w:"The modal comes before the subject."},
      {s:"No sooner had they left ___ it started to rain.",o:["when","than","then","that"],c:1,w:"No sooner is always followed by than."}]},
 {id:"g20",t:"Perfect modals: speculating about the past",
  body:["<b>Must have</b> + past participle expresses near certainty about the past: <i>She must have left already.</i> The negative is <b>can't have</b>, not mustn't have.",
        "<b>Might have, may have, could have</b> express possibility: <i>He may have forgotten.</i> <b>Could have</b> also describes an unused past ability or opportunity: <i>You could have told me.</i>",
        "<b>Should have</b> and <b>ought to have</b> describe what did not happen but ought to have. <b>Needn't have</b> means it was done unnecessarily; <b>didn't need to</b> means it was not done at all."],
  ex:[["The lights are off — they must have gone out.","Near certainty."],
      ["She can't have finished already.","Certainty in the negative."],
      ["He might have missed the bus.","Possibility."],
      ["We needn't have rushed; the train was late.","Done, but unnecessary."]],
  qs:[{s:"His car isn't here. He ___ home.",o:["must go","must have gone","should go","can have gone"],c:1,w:"A confident deduction about the past."},
      {s:"She ___ seen us — she was facing the other way.",o:["mustn't have","can't have","shouldn't have","needn't have"],c:1,w:"Negative certainty uses can't have."},
      {s:"You ___ asked me. I'd have helped.",o:["should have","must have","can have","needn't have"],c:0,w:"A criticism of what was not done."},
      {s:"We ___ booked — the restaurant was empty.",o:["must have","needn't have","should have","can't have"],c:1,w:"It was done, but proved unnecessary."},
      {s:"I don't know where he is. He ___ working late.",o:["must be","might be","can be","should be"],c:1,w:"Might expresses uncertain possibility."}]},
 {id:"g21",t:"Participle clauses",
  body:["A participle clause replaces a longer clause when both halves share a subject, tightening formal writing. The present participle carries an active meaning: <i>Walking home, I noticed the door was open.</i>",
        "The past participle carries a passive meaning: <i>Written in 1890, the novel still sells well.</i>",
        "<b>Having</b> + past participle shows one action was complete before the next: <i>Having finished the report, she went home.</i> The subjects must match, or the sentence dangles: <i>Walking home, the rain started</i> is wrong, because the rain was not walking."],
  ex:[["Opening the letter, he sat down.","Two actions, same subject."],
      ["Built in 1890, the bridge is still in use.","Passive meaning."],
      ["Having eaten, we went for a walk.","Sequence."],
      ["Not knowing the way, I asked a passer-by.","Negative form."]],
  qs:[{s:"___ the door, she noticed a note on the floor.",o:["Opened","Opening","To open","Having opened by"],c:1,w:"An active meaning takes the present participle."},
      {s:"___ in Latin, the inscription took days to translate.",o:["Writing","Having written","Written","Write"],c:2,w:"A passive meaning takes the past participle."},
      {s:"___ all the evidence, the committee reached a decision.",o:["Reviewing had","Having reviewed","Reviewed","Being reviewed"],c:1,w:"Having + participle shows the earlier completed action."},
      {s:"Which sentence dangles?",o:["Turning the corner, I saw the shop.","Turning the corner, the shop came into view.","Having turned the corner, I saw the shop.","Exhausted, I sat down."],c:1,w:"The shop was not turning the corner, so the subjects do not match."},
      {s:"___ what to say, he stayed silent.",o:["Not knowing","Don't knowing","Knowing not","Not known"],c:0,w:"Not goes before the participle."}]},
 {id:"g22",t:"Cleft sentences and emphasis",
  body:["A cleft sentence splits one idea in two so a chosen part can be stressed. The <b>it-cleft</b> highlights a noun phrase: <i>It was Anita who sent the email</i> — not anyone else.",
        "The <b>wh-cleft</b> puts the emphasis at the end, where English naturally places new information: <i>What I need is a week off. What surprised me was the price.</i>",
        "Variants include <i>All I want is…</i>, <i>The reason (why)… is that…</i>, and <i>The thing that bothers me is…</i> These are extremely common in careful speech and argument."],
  ex:[["It was the delay that caused the complaint.","Highlights the delay."],
      ["What I object to is the tone.","Emphasis falls at the end."],
      ["All she did was ask a question.","Minimising cleft."],
      ["The reason I called is that the date changed.","Reason cleft."]],
  qs:[{s:"___ the noise that kept me awake.",o:["That was","It was","There was","What was"],c:1,w:"It-clefts begin with it was or it is."},
      {s:"___ I don't understand is the pricing.",o:["That","It","What","Which"],c:2,w:"Wh-clefts begin with what."},
      {s:"It was in 2019 ___ the factory closed.",o:["which","who","that","when that"],c:2,w:"After an it-cleft with a time phrase, use that."},
      {s:"___ was his honesty.",o:["What impressed me","That impressed me","It impressed me","Which impressed me"],c:0,w:"A what-clause can serve as the subject."},
      {s:"All ___ is a straight answer.",o:["what I want","I want","that I want it","I want it"],c:1,w:"All I want is — no extra pronoun."}]},
 {id:"g23",t:"Hedging and academic caution",
  body:["Careful writing rarely makes flat claims. <b>Hedges</b> mark how confident you are: <i>appears to, tends to, is likely to, suggests, may well, arguably, broadly speaking.</i>",
        "Strength is a scale. <i>The data prove</i> is absolute; <i>the data suggest</i> is measured; <i>the data may indicate</i> is tentative. Choosing the wrong point on that scale is the commonest fault in advanced writing.",
        "<b>Boosters</b> do the opposite and should be rationed: <i>clearly, undoubtedly, it is evident that.</i> Overusing them makes a weak argument sound defensive rather than strong."],
  ex:[["The findings suggest a link between the two.","Measured claim."],
      ["Costs tend to rise in the second year.","A pattern, not a law."],
      ["This may well be the deciding factor.","Tentative but leaning."],
      ["Arguably, the policy achieved the opposite.","Signals a defensible but contestable view."]],
  qs:[{s:"Which is the most cautious?",o:["The results prove the theory.","The results confirm the theory.","The results appear to support the theory.","The results clearly show the theory is right."],c:2,w:"Appear to support is the weakest and most careful claim."},
      {s:"Sales ___ to fall in January.",o:["tend","tends","are tending","tended always"],c:0,w:"Sales is plural, so tend."},
      {s:"Which word is a booster rather than a hedge?",o:["possibly","undoubtedly","apparently","somewhat"],c:1,w:"Undoubtedly strengthens a claim instead of softening it."},
      {s:"The evidence is ___ inconclusive.",o:["largely","proven","absolutely certainly","definitely not"],c:0,w:"Largely hedges the extent of the claim."},
      {s:"It ___ that further study is needed.",o:["would appear","appears to be","is appear","appearing"],c:0,w:"It would appear that is a standard cautious formula."}]},
 {id:"g24",t:"The subjunctive and formal structures",
  body:["After verbs and adjectives of demanding, suggesting and requiring — <i>insist, demand, suggest, recommend, propose, essential, vital, crucial</i> — formal English uses the bare base form for every subject: <i>We recommend that he be informed. It is essential that she arrive on time.</i>",
        "British English often prefers <i>should</i> in the same slot: <i>We recommend that he should be informed.</i> Both are correct.",
        "The <b>were-subjunctive</b> survives in unreal conditions and set phrases: <i>If I were you. As it were. Were it not for the rain, we'd have finished.</i>"],
  ex:[["The committee demanded that the report be rewritten.","No -s, no is."],
      ["It is vital that everyone attend.","Base form after vital that."],
      ["She suggested that he apply again.","Not applies."],
      ["Were it not for her help, we'd have failed.","Formal inverted condition."]],
  qs:[{s:"It is essential that he ___ present.",o:["is","be","will be","being"],c:1,w:"The subjunctive uses the bare base form."},
      {s:"They insisted that she ___ immediately.",o:["leaves","left","leave","leaving"],c:2,w:"After insist that, use the base form."},
      {s:"I recommend that the deadline ___ extended.",o:["is","be","was","being"],c:1,w:"Passive subjunctive: be extended."},
      {s:"___ it not for the delay, we'd be there by now.",o:["Was","Were","If","Had"],c:1,w:"The were-subjunctive survives in this fixed pattern."},
      {s:"The judge ordered that the documents ___ released.",o:["are","be","were","being"],c:1,w:"Order that takes the subjunctive."}]}
]};

 {id:"t1",t:"Ordering in a café",set:"You're at the counter of a small café at lunchtime.",
  d:[["Server","Hi there. What can I get you?"],["You","Could I have a flat white, please?"],["Server","Sure. To have here or take away?"],["You","To have here, thanks."],["Server","Anything to eat with that?"],["You","No, I'm fine for now. How much is it?"],["Server","That's three fifty. Card or cash?"],["You","Card, please."]],
  p:[["Could I have…, please?","The safest, most natural way to order anything."],["To have here or take away?","Expect this everywhere. Answer with either half of it."],["I'm fine for now.","A soft no that doesn't sound rude."],["How much is it?","For several items, ask how much is that altogether?"]]},
 {id:"t2",t:"Asking for directions",set:"You're lost in an unfamiliar part of town.",
  d:[["You","Excuse me, sorry to bother you. Is there a chemist near here?"],["Local","There's one on Hill Road, about five minutes that way."],["You","Sorry, could you say that again a bit slower?"],["Local","Of course. Go straight ahead, then turn left at the traffic lights."],["You","Straight ahead, then left at the lights. Got it."],["Local","That's it. You'll see it on your right, next to the bank."],["You","Thanks so much for your help."]],
  p:[["Sorry to bother you.","Opens politely with a stranger."],["Could you say that again a bit slower?","Far better than just what? — nobody minds being asked."],["Go straight ahead, then turn left.","The two core direction verbs."],["Got it.","Signals you understood and the exchange can end."]]},
 {id:"t3",t:"Meeting someone new",set:"A friend's birthday party. You don't know anyone yet.",
  d:[["Sam","Hi, I don't think we've met. I'm Sam."],["You","Nice to meet you, Sam. I'm Ravi."],["Sam","So how do you know Priya?"],["You","We used to work together. And you?"],["Sam","We're neighbours, actually. Have been for years."],["You","Oh nice. Whereabouts do you live?"],["Sam","Just off the main road, near the park."]],
  p:[["I don't think we've met.","A gentle way to introduce yourself."],["How do you know…?","The standard party question. Always safe."],["And you?","Hands the question back and keeps things even."],["Whereabouts do you live?","Friendlier and vaguer than where exactly."]]},
 {id:"t4",t:"At the pharmacy",set:"You've had a sore throat and a cough for three days.",
  d:[["Pharmacist","Hello, how can I help?"],["You","I've had a sore throat for about three days and now a cough."],["Pharmacist","Any fever?"],["You","A slight one last night, but it's gone now."],["Pharmacist","Are you taking any other medication?"],["You","No, nothing at all."],["Pharmacist","Try these lozenges and this syrup, twice a day after food."],["You","How long should I take it for?"],["Pharmacist","Five days. If it's no better by then, see a doctor."]],
  p:[["I've had … for three days.","Present perfect with for — the standard way to report symptoms."],["Any fever?","Short question forms are normal here. Answer briefly."],["Are you taking any other medication?","Expect this question every time."],["How long should I take it for?","Always ask this before you leave."]]},
 {id:"t5",t:"Buying clothes",set:"You've found a shirt you like but the size looks wrong.",
  d:[["Assistant","Are you looking for anything in particular?"],["You","I'm just browsing, thanks. Actually — do you have this in a medium?"],["Assistant","Let me check. We might have one out the back."],["You","Could I try it on first?"],["Assistant","Of course. The fitting rooms are just behind you."],["You","It's a bit tight across the shoulders. Do you have the next size up?"],["Assistant","I'll bring you a large."],["You","Perfect, thank you."]],
  p:[["I'm just browsing.","Politely stops a salesperson without being rude."],["Do you have this in a medium?","The standard size request."],["Could I try it on?","Try on is the fixed phrase for clothes."],["The next size up.","Up for bigger, down for smaller."]]},
 {id:"t6",t:"Taking a phone message",set:"You answer a colleague's phone while they're out.",
  d:[["Caller","Hello, could I speak to Meera, please?"],["You","I'm afraid she's not at her desk. Can I take a message?"],["Caller","Yes, please. It's Arun from Delta Printing."],["You","Sorry, could you spell that for me?"],["Caller","A-R-U-N. Just tell her the proofs are ready."],["You","The proofs are ready. Can I get a number for her to call you back?"],["Caller","It's 98110 42317."],["You","Let me read that back — 98110 42317. I'll pass it on."]],
  p:[["She's not at her desk.","Politer than she's not here."],["Can I take a message?","Standard phone English."],["Could you spell that for me?","Never guess a name."],["Let me read that back.","Prevents mistakes with numbers."]]},
 {id:"t7",t:"At the ticket counter",set:"You're buying a train ticket for tomorrow morning.",
  d:[["Clerk","Where are you travelling to?"],["You","Amritsar, please. Tomorrow morning if possible."],["Clerk","Single or return?"],["You","Return, coming back Sunday evening."],["Clerk","There's a 7.15 and a 9.40."],["You","I'll take the 9.40. Is it direct?"],["Clerk","You change at Jalandhar. Twenty-minute wait."],["You","That's fine. Which platform does it leave from?"]],
  p:[["Single or return?","One-way or round trip. Expect the question."],["Is it direct?","Asks whether you must change trains."],["You change at…","The fixed verb for switching trains."],["Which platform does it leave from?","Note the preposition at the end."]]}
],
intermediate:[
 {id:"t8",t:"Calling in sick",set:"It's 8am and you're not well enough to work.",
  d:[["Manager","Morning, this is Anna."],["You","Hi Anna, it's Ravi. I'm afraid I won't be able to make it in today."],["Manager","Sorry to hear that. What's going on?"],["You","I've come down with a bad throat infection. I've got a doctor's appointment at eleven."],["Manager","No problem. Is anything urgent on your plate?"],["You","The client deck is due Thursday, but I'm on track. I'll email Dev to cover the standup."],["Manager","Perfect. Rest up and keep me posted."]],
  p:[["I won't be able to make it in today.","Neutral and professional."],["I've come down with…","The natural phrase for catching an illness."],["Is anything urgent on your plate?","On your plate = among your current tasks."],["I'll keep you posted.","Promises an update without fixing a time."]]},
 {id:"t9",t:"Returning a faulty item",set:"The headphones you bought last week have stopped working.",
  d:[["Staff","Hi, how can I help?"],["You","I bought these headphones here last Tuesday and the left one's stopped working."],["Staff","Do you have the receipt?"],["You","I do, here you go. I'd like a refund if that's possible."],["Staff","We'd normally offer an exchange within fourteen days."],["You","I understand, but it's a fault rather than a change of mind, so I think a refund is fair."],["Staff","Let me check with my manager."],["You","Thanks, I appreciate it."]],
  p:[["It's stopped working.","Describe the fault plainly."],["I'd like a refund if that's possible.","Softened, but still a clear request."],["I understand, but…","Acknowledge the rule, then hold your position."],["I appreciate it.","Warmer than thanks for a favour."]]},
 {id:"t10",t:"Rescheduling with a friend",set:"You agreed to meet on Saturday, but something has come up.",
  d:[["Maya","Still on for Saturday?"],["You","That's actually why I'm messaging — something's come up and I can't make Saturday."],["Maya","Ah, no worries. Everything okay?"],["You","Yeah, all fine, my cousin's visiting that weekend. Could we push it to the following week?"],["Maya","Sure. Does Sunday the 14th work for you?"],["You","Sunday's perfect. Same place, same time?"],["Maya","Works for me. See you then."]],
  p:[["Something's come up.","Explains a cancellation without details."],["Could we push it to…?","The everyday phrase for moving a plan later."],["Does … work for you?","How native speakers propose a time."],["Same place, same time?","Confirms everything in four words."]]},
 {id:"t11",t:"Viewing a flat",set:"You're seeing a one-bedroom flat you might rent.",
  d:[["Agent","So this is the living room, and the bedroom's through there."],["You","It's brighter than I expected. What's included in the rent?"],["Agent","Water and maintenance. Electricity is separate."],["You","Roughly what would electricity come to in summer?"],["Agent","Most tenants pay around two thousand a month."],["You","And how much is the deposit?"],["Agent","Two months, refundable when you move out."],["You","Is there any flexibility on the rent for a longer lease?"],["Agent","Possibly, if you sign for two years."]],
  p:[["What's included in the rent?","The single most useful question at a viewing."],["Roughly what would … come to?","Asks for an estimate without demanding a figure."],["How much is the deposit?","Ask early; it is often the largest sum."],["Is there any flexibility on…?","Opens a negotiation politely."]]},
 {id:"t12",t:"Sorting out a billing error",set:"You've been charged twice for the same order.",
  d:[["Agent","Thanks for holding. How can I help?"],["You","I've been charged twice for order 4471. I can see both amounts on my statement."],["Agent","Let me pull that up… yes, I can see two transactions."],["You","Could you refund the duplicate?"],["Agent","I can raise a request. It takes five to seven working days."],["You","That's longer than I'd hoped. Is there any way to speed it up?"],["Agent","I'll mark it as a billing error, which is usually faster."],["You","Thanks. Could you send me a confirmation email with a reference number?"]],
  p:[["I've been charged twice.","Present perfect passive — the natural form for this."],["Let me pull that up.","You'll hear this constantly on support calls."],["Is there any way to speed it up?","Pushes without confrontation."],["Could you send me a confirmation with a reference number?","Always ask. It protects you later."]]},
 {id:"t13",t:"A neighbour problem",set:"The flat above you plays loud music late at night.",
  d:[["Neighbour","Oh, hi. Everything alright?"],["You","Hi — sorry to knock so late. I wanted to mention the music."],["Neighbour","Is it loud? I didn't realise."],["You","It carries quite a bit after about eleven. I'm up early for work."],["Neighbour","Ah, I'm sorry. I'll keep it down after ten."],["You","That would really help. I didn't want to make a thing of it."],["Neighbour","No, thanks for coming up rather than complaining to the landlord."]],
  p:[["I wanted to mention…","Opens a complaint gently."],["It carries quite a bit.","Carries = travels through walls. Blames the sound, not the person."],["That would really help.","Accepts the offer warmly."],["I didn't want to make a thing of it.","Signals you are not looking for conflict."]]},
 {id:"t14",t:"Your first day",set:"You've just joined and are being shown around.",
  d:[["Colleague","Welcome! Has anyone shown you where anything is yet?"],["You","Not yet — I only got my laptop twenty minutes ago."],["Colleague","Right. Kitchen's that way, and we all sit in this bay."],["You","Who should I go to if I'm stuck on something?"],["Colleague","Me for tools and access, Nina for anything client-facing."],["You","Good to know. Is there a standup, or is it more informal?"],["Colleague","Ten past nine, fifteen minutes, camera optional."],["You","I'll be there. Thanks for taking the time."]],
  p:[["Who should I go to if I'm stuck?","The best question to ask on day one."],["Good to know.","Acknowledges information without a long reply."],["Is there a standup, or is it more informal?","Offers two options so the answer is easy."],["Thanks for taking the time.","Closes warmly and professionally."]]}
],
advanced:[
 {id:"t15",t:"The weakness question",set:"A job interview. The question you were hoping to avoid.",
  d:[["Interviewer","And what would you say is your biggest weakness?"],["You","I'd say I've historically taken on too much myself rather than delegating."],["Interviewer","Can you give me an example?"],["You","On a product launch last year I kept the reporting in my own hands, and it became a bottleneck when I was off sick."],["Interviewer","How did you address it?"],["You","I built a shared dashboard and trained two colleagues on it. It's not fully solved, but the team no longer depends on me for it."],["Interviewer","That's a fair answer."]],
  p:[["I'd say I've historically…","Frames the flaw as something already being worked on."],["It became a bottleneck.","Precise and unemotional about a problem you caused."],["How did you address it?","Address is the standard verb for dealing with a problem."],["It's not fully solved, but…","Honesty here reads as credible, not weak."]]},
 {id:"t16",t:"Disagreeing in a meeting",set:"A colleague has proposed a timeline you think is unrealistic.",
  d:[["Colleague","So we'd ship the whole thing by the end of the month."],["You","I can see the appeal of that, but I'm not sure the testing window holds up."],["Colleague","We've done tighter turnarounds before."],["You","We have. Though in those cases we weren't also migrating the database. That's the bit that worries me."],["Colleague","Fair point. What would you suggest?"],["You","Could we split it — ship the front end this month and the migration in the first week of next?"],["Colleague","That's worth considering."]],
  p:[["I can see the appeal of that, but…","Concedes merit before pushing back."],["I'm not sure … holds up.","Questions the idea, not the person."],["That's the bit that worries me.","Narrows disagreement to one point."],["Could we split it?","Offers a route forward, not just an objection."]]},
 {id:"t17",t:"Pushing back on a deadline",set:"Your manager has asked for something by Friday.",
  d:[["Manager","I'd like the analysis on my desk by Friday."],["You","I want to be upfront — Friday's going to be tight given the audit work."],["Manager","How tight are we talking?"],["You","I could get you the headline numbers by Friday, but the full breakdown realistically lands Tuesday."],["Manager","The board only needs the headline figures on Friday."],["You","In that case Friday's doable. I'll flag it immediately if that changes."],["Manager","Good. Let's go with that."]],
  p:[["I want to be upfront.","Signals honest news without alarm."],["Friday's going to be tight.","Says no is unlikely without refusing outright."],["Realistically lands Tuesday.","Realistically marks an honest estimate."],["I'll flag it immediately if that changes.","Trades the concession for early warning."]]},
 {id:"t18",t:"Negotiating an offer",set:"You've been offered the job. The number is below what you wanted.",
  d:[["Recruiter","We're delighted to offer you the role at eighteen lakh."],["You","Thank you — I'm genuinely pleased. I do want to be open that the figure sits below what I'd been working towards."],["Recruiter","What did you have in mind?"],["You","Based on what similar roles are paying and the scope here, I'd been looking at twenty-two."],["Recruiter","That's above our band for this level."],["You","I understand. Is there room on the joining bonus or the review timeline instead?"],["Recruiter","We could bring the first review forward to six months."],["You","That would go a long way. Could we put that in writing?"]],
  p:[["I do want to be open that…","Introduces a disagreement without souring the mood."],["What did you have in mind?","Expect it — have a number ready."],["Is there room on … instead?","Moves the negotiation to a softer variable."],["Could we put that in writing?","Turns a verbal promise into a commitment."]]},
 {id:"t19",t:"Giving difficult feedback",set:"Someone you manage has missed two deadlines in a row.",
  d:[["You","I wanted to talk about the last two deliverables. Both landed late, and I'd like to understand why."],["Report","I know. The data kept changing underneath me."],["You","That's useful to know. What I'd have wanted is a heads-up before the date, not on it."],["Report","Fair. I kept thinking I'd catch up."],["You","That's the instinct I'd like to change. A late warning costs the team much less than a missed date."],["Report","Understood. I'll flag as soon as I'm at risk."],["You","Good. And if the data's unstable, tell me — that's a problem I can actually help with."]],
  p:[["I'd like to understand why.","Opens with curiosity, not a verdict."],["What I'd have wanted is…","States the expectation clearly without insult."],["That's the instinct I'd like to change.","Targets the behaviour, not the person."],["That's a problem I can actually help with.","Ends by offering support."]]},
 {id:"t20",t:"At a conference",set:"Coffee break. You want to speak to someone whose talk you liked.",
  d:[["You","I enjoyed your talk — particularly the part about the failed pilot."],["Speaker","Thank you. That's usually the bit people skip over."],["You","It's the bit I recognised. We ran something similar and hit the same wall."],["Speaker","Did you? How did you get past it?"],["You","We didn't, entirely. We ended up narrowing the scope rather than solving it."],["Speaker","That's more or less where we landed too."],["You","I'd be interested to compare notes properly. Would you mind if I sent you an email?"],["Speaker","Please do."]],
  p:[["Particularly the part about…","Specific praise proves you were listening."],["It's the bit I recognised.","Turns praise into a shared experience."],["That's more or less where we landed.","Where we landed = the conclusion we reached."],["I'd be interested to compare notes.","The natural way to propose staying in touch."]]},
 {id:"t21",t:"An unhappy client",set:"A delivery slipped and the client is angry on the call.",
  d:[["Client","This is the second time. I don't know what to tell my board."],["You","You're right to be frustrated, and I'm not going to argue with the facts."],["Client","So what actually went wrong?"],["You","Two of our reviewers were out and we had no cover. That's an internal failure, not a surprise from your side."],["Client","And what stops it happening again?"],["You","We've put a named backup on every review stage. I'd rather you judged that by what happens in March than by my saying so now."],["Client","That's fair."],["You","I'll send you a short written summary today so you have something for the board."]],
  p:[["You're right to be frustrated.","Validates without grovelling."],["That's an internal failure.","Taking responsibility plainly defuses anger faster than excuses."],["I'd rather you judged that by what happens…","Offers evidence instead of promises."],["So you have something for the board.","Solves the client's real problem, not just yours."]]}
]};

 {id:"r1",t:"The umbrella on the bus",mins:2,
  p:["Every morning Nadia takes the number 12 bus to the market. Last Tuesday it rained hard, so she carried her old blue umbrella.",

     "She went to the bus office the next day. A tired man behind the desk looked in a large box and pulled out four umbrellas. None of them was blue. But one was green, with a strong wooden handle, and nobody had asked for it in three months.",
     "'Take it,' he said. 'It rains more than people lose things.'"],

intermediate:[
 {id:"r6",t:"Why we yawn",mins:3,
  p:["Almost everyone assumes yawning means one thing: you are tired. It is a reasonable guess, and it is probably wrong, or at least incomplete.",
     "The old explanation was that a yawn pulls in extra oxygen when the blood runs low on it. That idea survived for most of the twentieth century until researchers tested it directly. People given air rich in oxygen went on yawning at the same rate. So did people given air rich in carbon dioxide. The theory quietly collapsed.",
     "A more convincing account is that yawning cools the brain. A deep yawn stretches the jaw, increases blood flow to the skull, and draws in air that is usually cooler than body temperature. Studies have found that people yawn more when the air outside is slightly cooler than they are, and considerably less when it is hotter — exactly what you would expect if the point is to shed heat.",
     "Then there is the strangest feature of all. Yawning is contagious. Reading this paragraph is enough to make a fair number of people yawn. Contagious yawning appears in humans, chimpanzees, dogs and a handful of other social species, and it spreads most easily between individuals who know each other well. That has led some researchers to treat it as a marker of social bonding.",
     "None of this rules out tiredness. We do yawn more before sleep and after waking. But the reason may have less to do with running out of air than with a brain that is changing temperature as it changes state."],
  qs:[{s:"What happened to the oxygen theory?",o:["It was confirmed","Experiments failed to support it","It was never tested","It applies only to animals"],c:1,w:"Extra oxygen made no difference to the rate of yawning."},
      {s:"When do people yawn less, according to the cooling account?",o:["When the air is hotter than they are","When they are alone","In the morning","In cool air"],c:0,w:"Yawning drops in hot air, as a cooling function predicts."},
      {s:"What does contagious yawning seem to indicate?",o:["Poor sleep","Illness","A social connection","Low oxygen"],c:2,w:"It spreads most between individuals who know each other."},
      {s:"What is the writer's final position on tiredness?",o:["It is irrelevant","It is still involved, but for a different reason","It is the only cause","The question cannot be studied"],c:1,w:"The last paragraph keeps tiredness but reinterprets why."}]},
 {id:"r7",t:"The night market comes back",mins:3,
  p:["For thirty years the covered market on Canal Street opened at six in the morning and shut at four in the afternoon, like markets everywhere. By 2019 half the stalls stood empty. Supermarkets had taken the weekly shop, and the traders who remained were selling to a shrinking group of regulars, most of them over sixty.",
     "The council's first instinct was to modernise: new lighting, new signage, a café. Footfall rose slightly and then settled back. What finally worked was a change nobody had proposed at the meetings — moving the opening hours.",
     "A trader named Farida asked whether she could open in the evening instead, arguing that the people who now lived in the converted flats above the market were at work all day. The council agreed to a three-month trial for anyone who wanted to join. Nine traders did.",
     "The evening market drew a different crowd and, crucially, a different kind of business. Fruit and vegetables did not sell much better after dark, but cooked food did. Within a year, twelve of the empty units had been taken by small kitchens. The fabric seller stayed open until nine and found that people browsed longer when they were not rushing to work.",
     "Not everyone gained. Two of the oldest traders, both selling household goods, could not staff an evening shift and left within eighteen months. The market survived, but it is not the market that was rescued — it is a different one that grew in the same building."],
  qs:[{s:"Why did the market decline?",o:["The building was unsafe","Supermarkets took the weekly shop","The council closed stalls","Rents rose"],c:1,w:"Supermarkets are named as the cause of the lost trade."},
      {s:"How well did the council's first attempt work?",o:["It failed completely","Footfall rose briefly then settled back","It doubled trade","It was never tried"],c:1,w:"New lighting and signage gave only a short-lived lift."},
      {s:"Which business benefited most from evening hours?",o:["Fruit and vegetables","Household goods","Cooked food","Books"],c:2,w:"Twelve empty units became small kitchens."},
      {s:"What does the last paragraph suggest?",o:["The rescue was painless","The original market was preserved","Survival came with real losses","The market closed"],c:2,w:"Two traders left and the writer stresses it is a different market."}]},
 {id:"r8",t:"The library that lends drills",mins:3,
  p:["The average household power drill is used for somewhere between six and thirteen minutes in its entire working life. The figure is repeated so often that its origin has been lost, but nobody who owns a drill finds it surprising.",
     "This is the observation behind the tool library. The idea is simple: members pay a small annual fee and borrow tools the way they borrow books. The first ones appeared in North America in the seventies, faltered, and returned in the last decade with better software and a clearer sense of who they are for.",
     "The economics are less obvious than they look. A tool library does not mainly save money on the tool itself, because a cheap drill costs little. What it saves is storage, maintenance and the decision. Members report that the real benefit is being able to attempt a job they would otherwise have paid someone else to do, or simply left undone.",
     "The failure mode is predictable and well documented: everyone wants the same six items on the same Saturday morning, and nobody wants the specialised tile cutter that sits on the shelf for a year. Successful libraries respond by charging nothing for the rare items and rationing the popular ones with booking systems.",
     "There is a second, quieter effect. Tool libraries tend to run repair workshops, because the staff are already the kind of people who can fix things and the members already own things that are broken. In several cities the workshop has outgrown the lending. What began as a way to avoid buying a drill has become a place where a kettle gets mended."],
  qs:[{s:"Why is the drill statistic used?",o:["To prove drills are badly made","To show most tools sit unused","To argue drills are too expensive","To criticise manufacturers"],c:1,w:"It introduces the observation that ownership is mostly idle."},
      {s:"According to the writer, what does a tool library mainly save?",o:["The cost of the tool","Storage, maintenance and the decision","Electricity","Time at work"],c:1,w:"The third paragraph says the tool itself is cheap; the savings are elsewhere."},
