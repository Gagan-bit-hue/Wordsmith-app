 {id:"r9",t:"Learning to say no",mins:3,
  p:["Most advice about saying no treats it as a matter of courage. Find the nerve, use the word, accept that some people will be disappointed. That framing is not wrong, but it skips the part that people actually find hard, which is not the word but the gap that follows it.",
     "In practice, a refusal that stops at no invites negotiation. The other person fills the silence with reasons, and each reason must then be answered. The refusal becomes a debate, and debates are usually won by whoever cares more in the moment, which is rarely the person who wanted to leave early.",
     "What works better is a refusal with a shape: a clear no, a short reason that cannot be argued with, and an alternative if you have one. 'I can't take that on this week — I've got the audit. I could look at it after the 20th.' The reason is factual rather than emotional, so there is nothing to dispute. The alternative gives the other person somewhere to go.",
     "The one move to avoid is the apologetic cascade, in which each sentence undoes the last. 'I'm so sorry, I'd love to, it's just that things are a bit mad, but maybe I could squeeze it in?' This reads as a yes that has not arrived yet, and the other person will wait for it.",
     "None of this makes refusal comfortable. It simply makes it shorter, which for most people turns out to be the same thing."],
  qs:[{s:"What does the writer say is the hard part of refusing?",o:["Saying the word no","The gap that follows the refusal","Choosing the right tone","Apologising properly"],c:1,w:"The first paragraph names the silence after no, not the word itself."},
      {s:"Why does a bare no cause problems?",o:["It sounds rude","It invites negotiation","It is unclear","It is too formal"],c:1,w:"The other person fills the silence with reasons that must be answered."},
      {s:"What kind of reason does the writer recommend?",o:["An emotional one","A vague one","A factual one that cannot be disputed","No reason at all"],c:2,w:"A factual reason leaves nothing to argue with."},
      {s:"What is the 'apologetic cascade'?",o:["Repeating no several times","Sentences that each undo the previous one","Apologising in writing","Refusing without explanation"],c:1,w:"Each clause weakens the last, so it reads as an unarrived yes."},
      {s:"What does the closing sentence claim?",o:["Refusal becomes easy with practice","A shorter refusal is effectively a more comfortable one","Refusal should be avoided","Comfort matters more than clarity"],c:1,w:"It says shorter turns out, for most people, to be the same as easier."}]},
 {id:"r10",t:"The two-minute rule and its limits",mins:3,
  p:["A popular piece of productivity advice says that if a task takes less than two minutes, you should do it immediately rather than write it down. The reasoning is that capturing, storing and later retrieving a small task costs more than simply finishing it.",
     "As arithmetic this is sound. As a rule for a working day it has a flaw that its supporters rarely mention: almost everything looks like it takes two minutes, and almost nothing does. The reply that takes two minutes to type takes fifteen to think about, and the interruption costs more again on the other side, when you return to whatever you were doing and spend several minutes finding your place.",
     "Studies of interrupted work put the recovery cost surprisingly high, though the exact figure varies with the task. What matters is the direction: the cost of a switch is paid twice, once going out and once coming back, and the two-minute rule counts only the time in the middle.",
     "The rule also rewards the wrong kind of task. Small requests arrive from other people; large ones tend to be your own. A day spent obeying the rule strictly can end with every inbox cleared and nothing of your own moved forward, which feels like productivity and is not.",
     "The sensible version keeps the rule but changes when it applies. Small tasks are batched into a window rather than done on arrival. The arithmetic still works, but it is done once, on a pile, rather than forty times on individual items."],
  qs:[{s:"What is the original justification for the rule?",o:["Small tasks are more important","Capturing and retrieving costs more than doing","People forget small tasks","It reduces stress"],c:1,w:"The first paragraph gives the storage-and-retrieval argument."},
      {s:"What flaw does the writer identify?",o:["Two minutes is too long","Tasks rarely take as little as they appear to","The rule is hard to remember","It only works for email"],c:1,w:"Almost everything looks like two minutes and almost nothing is."},
      {s:"What does the writer mean by the cost being 'paid twice'?",o:["You do the task twice","You lose time leaving the task and returning to it","It costs money as well as time","Two people are interrupted"],c:1,w:"The switch costs on the way out and again on the way back."},
      {s:"Why does the rule reward the wrong tasks?",o:["Small tasks are harder","Small requests come from others while large ones are your own","Large tasks are less useful","Inboxes are unimportant"],c:1,w:"Obeying it clears other people's requests while your own work stalls."},
      {s:"What does the writer propose instead?",o:["Abandoning the rule","Batching small tasks into a window","Doing only large tasks","Ignoring the inbox"],c:1,w:"The arithmetic is done once on a pile rather than repeatedly."}]}
],
advanced:[
 {id:"r11",t:"The quiet economics of repair",mins:4,
  p:["A washing machine bought in 1985 was expected to last twenty years, and the shop that sold it usually employed someone who could fix it. A washing machine bought today will probably last seven, and the nearest person qualified to open it may be forty miles away. This is not simply a story about products getting worse. It is a story about where the cost of a thing has quietly migrated.",
     "Manufacturing costs have fallen sharply in real terms. Labour costs have not. The consequence is that the economics of repair have inverted: a job that once cost a fraction of the replacement price now routinely exceeds it. Once repair costs more than replacement, the rational consumer replaces — and once enough consumers replace, the repair trade thins out, which raises the price of the remaining repairers, which pushes more consumers towards replacement. The loop tightens on itself.",
     "Manufacturers are often blamed, and some deserve it. Glued seams, proprietary screws and unavailable spare parts are real, deliberate and well documented. But it would be a mistake to treat design decisions as the whole explanation, because the loop would run even if every machine were built to open. The deeper driver is the price of an hour of skilled human attention relative to the price of a new object, and no amount of removable screws changes that ratio directly.",
     "This is why the more effective interventions have been economic rather than technical. Sweden cut VAT on repairs to certain goods. France introduced a repairability score printed beside the price, which appears to shift purchasing behaviour at the point of sale rather than years later. European right-to-repair rules oblige manufacturers to supply parts for a fixed period, which does not lower the cost of labour but removes the excuse that the part cannot be obtained.",
     "What none of these measures has yet done is rebuild the workforce. A repairer takes years to train and cannot be conjured by legislation. The countries that still have a dense repair economy tend to be the ones that never fully lost it — which suggests that the cheapest moment to protect such a trade is long before anyone notices it is disappearing."],
  qs:[{s:"What is the central mechanism the writer identifies?",o:["Deliberate breakage","A self-reinforcing loop between repair cost and replacement","Consumer laziness","Falling quality alone"],c:1,w:"The loop tightens on itself as the repair trade thins out."},
      {s:"How does the writer treat blame placed on manufacturers?",o:["Rejects it entirely","Accepts it as the full explanation","Partly fair but insufficient","Ignores it"],c:2,w:"Some deserve blame, but the loop would run even with repairable designs."},
      {s:"Why are the French and Swedish measures called economic?",o:["They act on price and information at the point of sale","They redesign products","They train repairers","They ban replacement"],c:0,w:"A VAT cut and a printed score both work through price and information."},
      {s:"What is the final paragraph's claim?",o:["Legislation can rebuild the trade quickly","Preserving an existing trade is cheaper than rebuilding one","Repair is not worth pursuing","All countries have lost their repairers"],c:1,w:"A repairer cannot be conjured by law, so protection beats reconstruction."}]},
 {id:"r12",t:"What maps leave out",mins:4,
  p:["Every map is a claim about what matters. The projection decides which countries look large, the choice of labels decides which places exist, and the blank spaces decide what is not worth naming. None of these are neutral decisions, and most of them are invisible to the person holding the map.",
     "Consider a standard road atlas. It shows a footpath only if that path has been formally recorded, which means it shows the routes that a bureaucracy once had reason to write down. A track worn across a field by two generations of schoolchildren does not appear, not because the cartographer is careless, but because the category does not exist in the source data. The map is accurate about what it claims to represent and silent about a great deal else.",
     "Digital maps have changed the nature of the omissions rather than removing them. A route-planning application knows a road's speed limit but not whether it is pleasant, knows a restaurant's rating but not whether it is somewhere you would be comfortable sitting alone. What it can measure expands every year; what it cannot measure it treats, for practical purposes, as absent. The danger is not that the application lies. It is that a generation of users comes to treat the measurable as the complete.",
     "Historians of cartography like to point out that early maps were honest about their ignorance. Blank regions were marked as unknown, and the edges of knowledge were drawn as edges. Modern maps have no blank regions. Every square is filled, coloured and labelled, which creates the impression of completeness even where the underlying data is thin or decades old.",
     "The useful habit is not distrust but a particular kind of attention: to ask of any map what question it was made to answer, and to assume that everything outside that question has been smoothed away. A map made to help lorries reach warehouses will be an excellent guide to warehouses and a poor guide to everything else — and it will not tell you which it is."],
  qs:[{s:"What is the main argument?",o:["Maps are usually inaccurate","Maps encode invisible choices about what matters","Digital maps solved the problem","Old maps were more accurate"],c:1,w:"Projections, labels and blanks are all non-neutral claims."},
      {s:"Why is the worn field path absent from the atlas?",o:["Carelessness","It is too small","The source data has no category for it","It is private land"],c:2,w:"The category does not exist in the data, not that anyone erred."},
      {s:"What worry is raised about digital maps?",o:["They lie","Users treat the measurable as everything there is","They are slow","They show too many paths"],c:1,w:"The danger named is completeness, not dishonesty."},
      {s:"Why does the writer admire early maps?",o:["They were beautiful","They marked the limits of their knowledge","They were detailed","They used better projections"],c:1,w:"Blank regions and drawn edges were honest about ignorance."},
      {s:"What does the closing paragraph recommend?",o:["Distrusting maps","Using paper maps","Asking what question the map was built to answer","Making your own"],c:2,w:"Attention to purpose, and to what was smoothed away."}]},
 {id:"r13",t:"The tyranny of the average",mins:4,
  p:["In the late 1940s the United States Air Force had a problem it could not explain. Its pilots were crashing at a rate that could not be attributed to training or to mechanical failure, and the cockpit — designed in 1926 to fit the average pilot — was eventually examined as a suspect.",
     "A young researcher named Gilbert Daniels was given the task of updating the average. He measured more than four thousand pilots across ten dimensions and then asked a question nobody had thought to ask: how many pilots were close to average on all ten? He defined close generously, as the middle thirty per cent of the range on each measure.",
     "The answer was none. Not a small number: zero. On any three dimensions, fewer than five per cent qualified. The average pilot, the figure the cockpit had been built around, described nobody at all.",
     "The conclusion the Air Force drew was not to find a better average but to abandon averages as a design target. Manufacturers were told to build adjustable seats, pedals and straps, and told that cost was not an acceptable objection. Adjustability, which had been treated as a luxury, became a requirement, and performance improved across the board.",
     "The lesson travels badly, which is why it keeps having to be relearned. An average is a real and useful description of a group. It is almost never a description of a member of that group, and any system designed for the average member is designed for someone who does not exist. Schools, software interfaces and medical dosing have each rediscovered this independently, usually after building for a phantom first.",
     "The harder question, and the one Daniels did not answer, is what to do when adjustability is genuinely impossible. A cockpit can be made to move. A curriculum and a public timetable cannot move for everyone at once, and the choice of which dimension to make flexible is a political decision dressed as a technical one."],
  qs:[{s:"What was Daniels asked to do?",o:["Redesign the cockpit","Update the average pilot's measurements","Train pilots better","Investigate mechanical faults"],c:1,w:"He was given the task of updating the average."},
      {s:"What did he find?",o:["Most pilots were near average","About half were near average","No pilot was near average on all ten measures","Only tall pilots crashed"],c:2,w:"The answer was zero, even with a generous definition of close."},
      {s:"What did the Air Force decide to do?",o:["Compute a better average","Require adjustable equipment","Select pilots by size","Reduce the number of measures"],c:1,w:"They abandoned averages and mandated adjustability."},
      {s:"Why does the writer say the lesson 'travels badly'?",o:["It is written in technical language","Other fields keep rediscovering it independently","It applies only to aircraft","It has been disproved"],c:1,w:"Schools, software and medicine each rediscovered it after building for a phantom."},
      {s:"What is the harder question raised at the end?",o:["How to measure people accurately","What to do when adjustability is impossible","Whether averages are ever useful","How to train researchers"],c:1,w:"Some systems cannot flex for everyone, making the choice political."}]},
 {id:"r14",t:"Why projects slip",mins:4,
  p:["Ask anyone who has managed work for a living why projects run late, and the first answer is usually optimism. People underestimate how long things take. This is true, well studied and given a name — the planning fallacy — but as an explanation it is close to useless, because knowing about it does not appear to cure it. Experienced estimators who are told about the planning fallacy continue to underestimate.",
     "A more structural account looks at where the slippage accumulates. Individual tasks are usually estimated with some accuracy at the median. What is missed is the shape of the distribution around that median: a task can finish slightly early but it can finish enormously late. The upside is bounded and the downside is not.",
     "Chain those asymmetric tasks together and the effect compounds, because a chain can only be as early as its slowest link allows, while any single link can delay everything behind it. Adding people does not fix this and often worsens it, since coordination grows faster than capacity — the observation Fred Brooks made in 1975 and which has survived every attempt to disprove it.",
     "A third factor is rarely discussed because it is uncomfortable. Estimates are political documents. The person giving the number usually wants the work approved, and a number that gets the project killed is a number nobody thanks you for. The result is a systematic downward pressure that has nothing to do with cognitive bias and everything to do with incentives, and it is the reason that organisations which punish late delivery tend to receive worse estimates, not better ones.",
     "The methods that actually help are unglamorous. Estimate ranges instead of points. Record what past work took and use it in preference to intuition. Keep the critical chain short. Separate the person who estimates from the person who must defend the budget. None of this makes a project predictable. It makes the unpredictability visible early, which is a different and more achievable goal."],
  qs:[{s:"Why does the writer call the planning fallacy 'close to useless' as an explanation?",o:["It has been disproved","Knowing about it does not stop the error","It applies only to beginners","It is too technical"],c:1,w:"Experienced estimators who know about it still underestimate."},
      {s:"What is the structural point about task distributions?",o:["Tasks are always underestimated at the median","Early finishes are bounded but late finishes are not","Most tasks finish early","Medians are unreliable"],c:1,w:"The upside is limited while the downside has no ceiling."},
      {s:"Why does adding people often make things worse?",o:["New people are less skilled","Coordination grows faster than capacity","It costs more","Tasks cannot be divided"],c:1,w:"That is the observation attributed to Brooks in 1975."},
      {s:"What is the 'uncomfortable' third factor?",o:["Poor tools","Estimates are shaped by incentives to get work approved","Lack of training","Bad luck"],c:1,w:"Estimates function as political documents, pushing numbers down."},
      {s:"According to the writer, what do the recommended methods achieve?",o:["Accurate prediction","Faster delivery","Early visibility of unpredictability","Lower costs"],c:2,w:"They make the uncertainty visible early rather than removing it."}]},
 {id:"r15",t:"The last speakers",mins:4,
  p:["When a language falls out of use, the loss is usually described in terms of vocabulary, as though what disappears is a list. Some of what goes is indeed lexical: words for plants that only grow in one valley, for kinship relations that other languages do not distinguish, for states of weather too specific to translate. But the more interesting losses are structural.",
     "Languages differ in what they oblige a speaker to specify. English forces you to mark tense; you cannot say a sentence about an event without indicating whether it has happened. Other languages force you to mark evidentiality — whether you saw the event yourself, were told about it, or infer it — and a speaker of such a language cannot report a fact without also reporting how they came to know it. Neither system is superior. But each makes certain habits of attention automatic, and when the last fluent speaker of an evidential language dies, a working demonstration that human beings can be built that way goes with them.",
     "This is why documentation is harder than it sounds. A dictionary and a grammar preserve the description of a language, not its use. What cannot be captured is the speed at which a fluent speaker deploys a construction, the range of things it can be stretched to mean, and the judgements about what sounds wrong — which are precisely what linguists most want and what disappears first, typically a generation before the last speaker dies.",
     "Revival efforts complicate the picture further. A revived language is a real language with real speakers, and its value to the community that revives it does not depend on how closely it matches the original. But it is usually a different thing: simpler in the places where the old structures were hardest, and shaped by the grammar of whatever language the revivers speak natively. Something returns. It is not always the same something.",
     "The most honest summary may be the least satisfying. Language loss is an event with no single victim and no single remedy, and the communities involved are rarely asking the question a linguist would ask. When a family stops speaking a language it is almost never because they have stopped valuing it. It is because the cost of continuing has been made, by someone else, too high."],
  qs:[{s:"What kind of loss does the writer find most interesting?",o:["Lexical loss","Structural loss","Loss of written records","Loss of place names"],c:1,w:"The opening sets aside vocabulary in favour of structure."},
      {s:"What is evidentiality?",o:["Marking tense","Marking how the speaker knows something","Marking politeness","Marking number"],c:1,w:"Whether you saw, were told, or inferred the event."},
      {s:"Why is documentation harder than it sounds?",o:["Recording equipment is expensive","Dictionaries capture description, not fluent use","Speakers refuse to help","Grammars are too long"],c:1,w:"Speed, stretch and wrongness judgements cannot be written down."},
      {s:"What does the writer say about revived languages?",o:["They are worthless","They exactly restore the original","They are real, but usually a different thing","They always fail"],c:2,w:"Something returns, shaped by the revivers' native grammar."},
      {s:"What is the final paragraph's point about why families stop?",o:["They stop valuing the language","The cost of continuing was made too high by others","The language was too difficult","They move abroad"],c:1,w:"The closing sentence puts the cause outside the family."}]}
]};

const KEY="wordsmith.v2";
const DEF={level:"beginner",known:{},lessons:{},reads:{},talks:{},xp:0,last:null,streak:0,best:{}};
let S=Object.assign({},DEF);

function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw)S=Object.assign({},DEF,JSON.parse(raw)); }
  catch(e){}
  S.known=S.known||{};S.lessons=S.lessons||{};S.reads=S.reads||{};S.talks=S.talks||{};S.best=S.best||{};
  touchStreak();
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function today(){return new Date().toISOString().slice(0,10);}
function touchStreak(){
  const t=today(); if(S.last===t)return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak=(S.last===y)?(S.streak||0)+1:1; S.last=t; save();
}
function award(n){S.xp=(S.xp||0)+n;save();}

const $=s=>document.querySelector(s);
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function lv(){return S.level;}
function pct(d,t){return t?Math.round(100*d/t):0;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function counts(){
  const v=VOCAB[lv()],g=GRAMMAR[lv()],t=TALK[lv()],r=READ[lv()];
  return {
    words:[v.filter(x=>S.known[x.id]).length,v.length],
    grammar:[g.filter(x=>S.lessons[x.id]).length,g.length],
    talk:[t.filter(x=>S.talks[x.id]).length,t.length],
    read:[r.filter(x=>S.reads[x.id]).length,r.length]
  };
}
function totalItems(){
  let n=0;["beginner","intermediate","advanced"].forEach(L=>{
    n+=VOCAB[L].length+GRAMMAR[L].length+TALK[L].length+READ[L].length;});
  return n+PHRASAL.length+IDIOMS.length+IRREGULAR.length+CONFUSED.length+LINKERS.length;
}

/* ---------- shared quiz ---------- */
function quizHTML(qs){
  return qs.map((q,i)=>`
    <div class="q" data-qi="${i}">
      <div class="qcount">Question ${i+1} of ${qs.length}</div>
      <div class="stem">${q.s}</div>
      ${q.o.map((o,j)=>`<button class="opt" data-qi="${i}" data-oi="${j}">${esc(o)}</button>`).join("")}
      <div class="why hidden"></div>
    </div>`).join("");
}
function wireQuiz(root,qs,onDone){
  let answered=0,right=0;
  root.querySelectorAll(".opt").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const qi=+btn.dataset.qi,oi=+btn.dataset.oi,q=qs[qi];
      const box=root.querySelector('.q[data-qi="'+qi+'"]');
      if(box.dataset.done)return;
      box.dataset.done="1";answered++;
      box.querySelectorAll(".opt").forEach((b,j)=>{
        b.disabled=true;
        if(j===q.c)b.classList.add("right"); else if(j===oi)b.classList.add("wrong");
      });
      if(oi===q.c){right++;award(5);}
      const why=box.querySelector(".why");
      why.textContent=q.w;why.classList.remove("hidden");
      if(answered===qs.length&&onDone)onDone(right,qs.length);
    });
  });
}

let AI=null;
const AIP=(async()=>{
  try{ AI=(window.claude&&claude.use)?await claude.use("sample"):null; }catch(e){ AI=null; }
  return AI;
})();
async function settleAI(root){
  await AIP;
  if(!AI)root.querySelectorAll("[data-needsai]").forEach(el=>el.remove());
  return AI;
}
function checkerHTML(prompt){
  return `<div class="ai" data-needsai>
    <h4>Write a sentence</h4>
    <p class="hint">${esc(prompt)} You'll get it back corrected, with a short note on why.</p>
    <textarea class="chkin" placeholder="Type your sentence here"></textarea>
    <div style="margin-top:10px"><button class="btn chkgo">Check my sentence</button></div>
    <div class="chkout"></div>
  </div>`;
}
function wireChecker(root,context){
  const panel=root.querySelector(".ai[data-needsai]");
  if(!panel)return;
  const ta=panel.querySelector(".chkin"),go=panel.querySelector(".chkgo"),out=panel.querySelector(".chkout");
  go.addEventListener("click",async()=>{
    const text=ta.value.trim();
    if(!text){ta.focus();return;}
    if(!AI){out.innerHTML='<div class="fbk">Sentence checking isn\'t available in this view.</div>';return;}
    go.disabled=true;out.innerHTML='<div class="spin">Reading your sentence…</div>';
    try{
      const r=await AI.json([{role:"user",content:
"You are a patient English teacher. A learner at "+lv()+" level is practising: "+context+
"\n\nTheir sentence: \""+text+"\"\n\nReply with ONLY a JSON object, no markdown fences:\n"+
'{"ok": true or false, "corrected": "the corrected sentence, or their sentence unchanged if already correct", "note": "one or two short sentences explaining the change, or praising what they got right. Plain, encouraging, no jargon."}'}],
        {modelTier:"quick"});
      const ok=!!r.ok;
      out.innerHTML='<div class="fbk"><div class="verdict '+(ok?"ok":"fix")+'">'+
        (ok?"That works.":"Nearly — here's a cleaner version.")+'</div><div class="fixed">'+
        esc(r.corrected||text)+'</div><div>'+esc(r.note||"")+'</div></div>';
      award(10);
    }catch(e){
      out.innerHTML='<div class="fbk">'+(e&&e.code==="rate_limited"
        ?"Too many checks just now. Try again in a minute.":"Couldn't check that one. Try again.")+'</div>';
    }
    go.disabled=false;
  });
}

function drawCard(){
  const root=$("#words");
  if(di>=deck.length){
    const learned=VOCAB[lv()].filter(x=>S.known[x.id]).length;
    root.innerHTML=`<h2 class="vh">Words</h2>${modeBar("deck")}

    return;
  }
  const c=deck[di];
  root.innerHTML=`
    <h2 class="vh">Words</h2>
    ${modeBar("deck")}
    <div class="deckhead"><span class="cnt">${di+1} of ${deck.length}</span></div>
    <div class="flash" id="flash" role="button" tabindex="0">
      ${flipped?`<div class="back">
          <div class="word" style="font-size:26px">${esc(c.w)}</div>

        </div>`:`<div><div class="word">${esc(c.w)}</div><div class="ipa">${esc(c.ipa)}</div></div>
        <div class="tapnote">Tap to reveal</div>`}
    </div>
    <div class="cardacts ${flipped?"":"hidden"}">
      <button class="btn againbtn" id="soso">Still learning</button>
      <button class="btn knowbtn" id="knew">I knew it</button>
    </div>
    ${checkerHTML("Use “"+c.w+"” in a sentence of your own.")}`;
  wireModeBar(root);
  const f=root.querySelector("#flash");
  const flip=()=>{flipped=!flipped;drawCard();};
  f.addEventListener("click",flip);
  f.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();}});
  if(flipped){
    root.querySelector("#knew").addEventListener("click",()=>{S.known[c.id]=1;award(5);save();di++;flipped=false;drawCard();});
    root.querySelector("#soso").addEventListener("click",()=>{delete S.known[c.id];save();di++;flipped=false;drawCard();});
  }
  wireChecker(root,'the vocabulary word "'+c.w+'" ('+c.def+')');
  settleAI(root);
}
function buildWordQuiz(){
  const pool=VOCAB[lv()];
  return shuffle(pool).slice(0,10).map(item=>{
    const wrong=shuffle(pool.filter(x=>x.id!==item.id)).slice(0,3).map(x=>x.w);
    const opts=shuffle([item.w].concat(wrong));
    return {s:item.def,o:opts,c:opts.indexOf(item.w),w:item.w+" "+item.ipa+" — "+item.ex};
  });
}
function drawWordQuiz(){
  const root=$("#words");
  const qs=buildWordQuiz();
  root.innerHTML=`<h2 class="vh">Words</h2>${modeBar("quiz")}
    <p class="vsub">Ten definitions, drawn at random from this level. Pick the word that fits.</p>
    <div id="wq">${quizHTML(qs)}</div><div id="ws"></div>`;
  wireModeBar(root);
  wireQuiz(root.querySelector("#wq"),qs,(right,total)=>{
    const key="vq-"+lv();
    const best=Math.max(S.best[key]||0,right);S.best[key]=best;award(10);save();
    root.querySelector("#ws").innerHTML=`<div class="card scorebox" style="margin-top:20px">
      <b>${right}/${total}</b><p class="vsub" style="margin:6px auto 14px">Your best at this level: ${best}/10.</p>
      <button class="btn" id="retry">Another ten</button></div>`;
    root.querySelector("#retry").addEventListener("click",()=>{drawWordQuiz();window.scrollTo(0,0);});
  });
}

function wireChat(root,s){
  const log=root.querySelector("#log"),inp=root.querySelector("#say"),
        send=root.querySelector("#send"),restart=root.querySelector("#restart");
  const other=s.d[0][0];
  let turns=[];
  function bub(who,text){
    const row=document.createElement("div");
    row.className="chatrow"+(who==="me"?" me":"");
    const b=document.createElement("div");b.className="bub";b.textContent=text;
    row.appendChild(b);log.appendChild(row);log.scrollTop=log.scrollHeight;return b;
  }
  function opener(){ log.innerHTML="";turns=[];bub("them",s.d[0][1]);turns.push({role:"assistant",content:s.d[0][1]}); }
  opener();
  restart.addEventListener("click",opener);
  async function goSend(){
    const text=inp.value.trim();if(!text)return;
    inp.value="";bub("me",text);turns.push({role:"user",content:text});
    const el=bub("them","Thinking…");send.disabled=true;
    const sys="You are role-playing a spoken English conversation to help a "+lv()+"-level learner practise.\n"+
      "Scene: "+s.set+"\nYou play \""+other+"\". The learner plays the other person.\n"+
      "Rules: stay in character; keep each reply to one or two short spoken sentences; use natural everyday English at roughly "+lv()+" level; move the conversation forward and ask something back.\n"+
      "If the learner's last message has a clear English mistake, add one short correction at the very end on a new line starting with \"↩ \". Example: ↩ Say \"I'd like a coffee\" rather than \"I want coffee\".\n"+
      "Never break character other than for that one correction line.";
    try{
      const r=await AI([{role:"user",content:sys}].concat(turns),
        {modelTier:"quick",onText:o=>{el.textContent=o.text;log.scrollTop=log.scrollHeight;}});
      el.textContent=r.text;turns.push({role:"assistant",content:r.text});award(5);
    }catch(e){
      el.textContent=(e&&e.code==="rate_limited")
        ?"Let's pause a moment — too many messages at once.":"That didn't send. Try again.";
    }
    send.disabled=false;inp.focus();
  }
  send.addEventListener("click",goSend);
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();goSend();}});
}

/* ============================================================
   READ
   ============================================================ */
function renderRead(){
  const root=$("#read");
  root.innerHTML=`<h2 class="vh">Read</h2>
    <p class="vsub">${READ[lv()].length} passages chosen for this level, each with comprehension questions.</p>
    ${READ[lv()].map(r=>`
      <button class="listitem" data-id="${r.id}">
        <span class="grow"><span class="nm">${esc(r.t)}</span>
        <span class="ds">${r.mins} min read · ${r.qs.length} questions</span></span>
        ${S.reads[r.id]?'<span class="doneflag">✓</span>':""}
      </button>`).join("")}`;
  root.querySelectorAll("[data-id]").forEach(b=>b.addEventListener("click",()=>openRead(b.dataset.id)));
}
function openRead(id){
  const r=READ[lv()].find(x=>x.id===id),root=$("#read");
  root.innerHTML=`
    <button class="backlink" id="back">← All passages</button>
    <div class="lesson">
      <h3>${esc(r.t)}</h3>
      <div class="passage">${r.p.map(p=>"<p>"+esc(p)+"</p>").join("")}</div>
      <div id="rq">${quizHTML(r.qs)}</div><div id="rs"></div>
    </div>`;
  root.querySelector("#back").addEventListener("click",renderRead);
  wireQuiz(root.querySelector("#rq"),r.qs,(right,total)=>{
    S.reads[r.id]=1;award(10);save();
    root.querySelector("#rs").innerHTML=`<div class="card scorebox" style="margin-top:20px">
      <b>${right}/${total}</b><p class="vsub" style="margin:6px auto 0">${
        right===total?"Every question right.":right/total>=0.6?"Solid — check the notes on the ones you missed."
        :"Worth reading once more, then trying again."}</p></div>`;
  });
  window.scrollTo(0,0);
}

/* ============================================================
   TOOLS
   ============================================================ */
let toolTab="phrasal",toolQ="";
const TOOLS=[
  ["phrasal","Phrasal verbs"],["idioms","Idioms"],["irregular","Irregular verbs"],
  ["confused","Easily confused"],["linkers","Linking words"]
];
function renderTools(){
  const root=$("#tools");
  root.innerHTML=`<h2 class="vh">Reference tools</h2>
    <p class="vsub">The lists worth keeping close. Search filters whichever list is open.</p>
    <div class="chips">${TOOLS.map(t=>
      `<button class="chip" data-tt="${t[0]}" aria-pressed="${toolTab===t[0]}">${t[1]}</button>`).join("")}</div>
    <input type="text" class="searchbox" id="tsearch" placeholder="Search" value="${esc(toolQ)}">
    <div id="tbody"></div>`;
  root.querySelectorAll("[data-tt]").forEach(b=>b.addEventListener("click",()=>{
    toolTab=b.dataset.tt;renderTools();
  }));
  const box=root.querySelector("#tsearch");
  box.addEventListener("input",()=>{toolQ=box.value;drawTools();});
  drawTools();
}
function drawTools(){
  const body=$("#tbody"),q=toolQ.trim().toLowerCase();
  const hit=row=>!q||row.join(" ").toLowerCase().includes(q);
  let rows,html;
  if(toolTab==="irregular"){
    rows=IRREGULAR.filter(hit);
    html=`<div class="tally">${rows.length} verbs</div><div class="card scrollx" style="padding:4px 16px">
      <table class="vtable"><thead><tr><th>Base</th><th>Past simple</th><th>Past participle</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}
      </tbody></table></div>`;
  }else{
    const src={phrasal:PHRASAL,idioms:IDIOMS,confused:CONFUSED,linkers:LINKERS}[toolTab];
    rows=src.filter(hit);
    const label={phrasal:"phrasal verbs",idioms:"idioms",confused:"pairs",linkers:"groups"}[toolTab];
    html=`<div class="tally">${rows.length} ${label}</div><div class="card" style="padding:4px 16px">
      ${rows.map(r=>`<div class="entry"><div class="hw">${esc(r[0])}</div>
        <div class="mn">${esc(r[1])}</div><div class="eg">${esc(r[2])}</div></div>`).join("")}</div>`;
  }
  if(!rows.length)html='<div class="empty">Nothing matches that. Try a shorter search.</div>';
  body.innerHTML=html;
}

/* ============================================================
   NAV
   ============================================================ */
const R={home:renderHome,words:renderWords,grammar:renderGrammar,talk:renderTalk,read:renderRead,tools:renderTools};
function go(name){
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+name));
  document.querySelectorAll(".tab").forEach(t=>{
    if(t.dataset.go===name)t.setAttribute("aria-current","page");else t.removeAttribute("aria-current");});
  R[name]();window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>go(t.dataset.go)));
$("#lvlpick").addEventListener("change",e=>{
  S.level=e.target.value;save();wordsMode="deck";
  const cur=document.querySelector('.tab[aria-current="page"]');
  go(cur?cur.dataset.go:"home");
});
$("#themebtn").addEventListener("click",()=>{
  const cur=document.documentElement.dataset.theme;
  const dark=window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme=cur?(cur==="dark"?"light":"dark"):(dark?"light":"dark");
});

load();
$("#lvlpick").value=S.level;
go("home");

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}

</script>
